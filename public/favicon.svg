<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aureusGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE592" />
      <stop offset="35%" stop-color="#E5C365" />
      <stop offset="70%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#997728" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Main stylized 'A' shape with financial growth arrow -->
    <!-- Left diagonal stem -->
    <path
      d="M16 80 L44 14 L56 14 L36 62 L26 52 L16 80 Z"
      fill="url(#aureusGold)"
    />
    
    <!-- Right diagonal stem (bottom segment) -->
    <path
      d="M62 58 L72 80 L84 80 L67 48 L62 58 Z"
      fill="url(#aureusGold)"
    />
    
    <!-- Right diagonal stem (top segment above arrow) -->
    <path
      d="M50 14 L56 14 L68 38 L60 44 L50 14 Z"
      fill="url(#aureusGold)"
    />

    <!-- Upward Trend Line and Arrow -->
    <path
      d="M36 62 L52 74 L80 40 L76 36 L52 64 L42 56 Z"
      fill="url(#aureusGold)"
    />
    
    <!-- Arrow Head -->
    <polygon
      points="86,30 68,36 78,46"
      fill="url(#aureusGold)"
    />
  </g>
</svg>